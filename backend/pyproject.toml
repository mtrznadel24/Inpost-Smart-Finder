[tool.poetry]
name = "inpost-smart-finder-backend"
version = "0.1.0"
description = "Backend API for spatial filtering of InPost parcel lockers"
authors = ["mtrznadel24 <maciej.trznadel24@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
sqlalchemy = "^2.0.30"
geoalchemy2 = "^0.15.1"
asyncpg = "^0.29.0"
pydantic = "^2.7.1"
pydantic-settings = "^2.2.1"
httpx = "^0.27.0"
alembic = "^1.13.1"
arq = "^0.28.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.12"
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"
respx = "^0.23.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-ra",
]